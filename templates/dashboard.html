<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Trading Journal — Дашборд</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f1115;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
        }
        /* ===== HEADER ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: #161920;
            border-bottom: 1px solid #23262d;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo {
            color: #00ff88;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-nav {
            background: #00ff88;
            color: #0a0c10;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0,255,136,0.25);
        }
        .broker-badge {
            background: #1e2128;
            border: 1px solid #2a2e39;
            color: #00ff88;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lang-select {
            background: #1e2128;
            border: 1px solid #2a2e39;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-api {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-api:hover { background: #2563eb; }
        .user-menu {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #e2e8f0;
        }
        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ff88;
        }
        .avatar-placeholder {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #1e2128;
            border: 2px solid #00ff88;
            color: #00ff88;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        /* ===== MAIN ===== */
        main { padding: 24px; max-width: 1400px; margin: 0 auto; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        h2 { font-size: 18px; font-weight: 600; }
        .btn-sync {
            background: #00ff88;
            color: #0a0c10;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-sync:hover { opacity: 0.9; }
        .sync-msg {
            color: #848e9c;
            font-size: 13px;
            margin-left: 12px;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #161920;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #23262d;
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid #23262d;
        }
        th {
            color: #848e9c;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            background: #1a1d24;
        }
        tr { transition: background 0.15s; }
        tr:hover { background-color: #1e2128; cursor: pointer; }
        .badge-short {
            background: rgba(246,70,93,0.15);
            color: #f6465d;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-long {
            background: rgba(14,203,129,0.15);
            color: #0ecb81;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }
        .empty-state {
            text-align: center;
            padding: 50px;
            color: #848e9c;
        }

        /* ===== CHART ===== */
        #chart-wrap {
            background: #161920;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
            border: 1px solid #23262d;
            position: relative;
        }
        .chart-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-right: 30px;
        }
        .chart-title { color: #00ff88; font-size: 16px; font-weight: 700; }
        .trade-meta {
            display: flex;
            gap: 18px;
            font-size: 13px;
            color: #848e9c;
        }
        .trade-meta strong { color: #fff; }
        .timeframes {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .tf-btn {
            background: #1e2128;
            color: #848e9c;
            border: 1px solid #2a2e39;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .tf-btn.active, .tf-btn:hover {
            background: #00ff88;
            color: #0a0c10;
            border-color: #00ff88;
        }
        .close-chart {
            position: absolute;
            top: 16px;
            right: 16px;
            background: transparent;
            border: none;
            color: #848e9c;
            font-size: 20px;
            cursor: pointer;
            width: 32px; height: 32px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
        }
        .close-chart:hover { background: #f6465d; color: #fff; }
        #tv-chart { width: 100%; height: 420px; }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            display: none; align-items: center; justify-content: center;
            z-index: 200;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #161920;
            border: 1px solid #2a2e39;
            border-radius: 12px;
            width: 420px;
            padding: 24px;
        }
        .modal h3 { margin-bottom: 18px; font-size: 18px; }
        .form-row { margin-bottom: 14px; }
        .form-row label { display: block; font-size: 13px; color: #848e9c; margin-bottom: 6px; }
        .form-row input, .form-row select {
            width: 100%;
            padding: 10px 12px;
            background: #0f1115;
            border: 1px solid #2a2e39;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }
        .modal-actions {
            display: flex; gap: 10px; margin-top: 20px;
        }
        .modal-actions button {
            flex: 1; padding: 10px; border-radius: 6px; border: none;
            font-weight: 600; cursor: pointer; font-size: 14px;
        }
        .btn-save { background: #00ff88; color: #0a0c10; }
        .btn-cancel { background: #2a2e39; color: #fff; }
        .key-list { margin-top: 18px; }
        .key-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #0f1115; padding: 10px 12px; border-radius: 6px;
            margin-bottom: 8px; font-size: 13px;
        }
        .key-plat { color: #00ff88; font-weight: 600; }
        .key-del { color: #f6465d; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <div class="logo">📊 Trading Journal</div>
        <button class="btn-nav">Мои сделки</button>
    </div>
    <div class="header-right">
        <div class="broker-badge" id="active-broker" style="display:none">
            <span>🟢</span> <span id="broker-name">Tiger Trade</span>
        </div>
        <select class="lang-select" id="lang-switch">
            <option value="ru">Русский</option>
            <option value="ua">Українська</option>
        </select>
        <button class="btn-api" onclick="openApiModal()">+ API-ключи</button>
        <div class="user-menu">
            <span>{{ user.name }}</span>
            {% if user.avatar_url %}
                <img src="{{ user.avatar_url }}" class="avatar" alt="avatar">
            {% else %}
                <div class="avatar-placeholder">?</div>
            {% endif %}
        </div>
    </div>
</header>

<main>
    <div class="top-bar">
        <h2>📋 История сделок</h2>
        <div style="display:flex;align-items:center">
            <button class="btn-sync" onclick="syncAll()">🔄 Синхронизировать</button>
            <span id="sync-msg" class="sync-msg"></span>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Тикер</th>
                <th>Вход</th>
                <th>Выход</th>
                <th>Сторона</th>
                <th>P&L %</th>
                <th>Прибыль ($)</th>
                <th>Комиссия</th>
                <th>Объём ($)</th>
            </tr>
        </thead>
        <tbody id="trades-tbody">
            <tr><td colspan="8" class="empty-state">Загрузка...</td></tr>
        </tbody>
    </table>

    <div id="chart-wrap">
        <button class="close-chart" onclick="closeChart()" title="Закрыть">✕</button>
        <div class="chart-top">
            <div class="chart-title" id="chart-title">График</div>
            <div class="trade-meta" id="trade-meta"></div>
        </div>
        <div class="timeframes" id="tf-group">
            <button class="tf-btn active" data-tf="1">1m</button>
            <button class="tf-btn" data-tf="3">3m</button>
            <button class="tf-btn" data-tf="5">5m</button>
            <button class="tf-btn" data-tf="15">15m</button>
            <button class="tf-btn" data-tf="60">1h</button>
            <button class="tf-btn" data-tf="240">4h</button>
            <button class="tf-btn" data-tf="D">1D</button>
        </div>
        <div id="tv-chart"></div>
    </div>
</main>

<!-- MODAL API KEYS -->
<div class="modal-overlay" id="api-modal">
    <div class="modal">
        <h3>🔑 API-ключи</h3>
        <div class="form-row">
            <label>Платформа</label>
            <select id="api-platform" onchange="togglePassphrase()">
                <option value="Bybit">Bybit</option>
                <option value="Binance">Binance</option>
                <option value="OKX">OKX</option>
                <option value="Tiger Trade">Tiger Trade</option>
                <option value="Vataga">Vataga</option>
            </select>
        </div>
        <div class="form-row">
            <label>API Key</label>
            <input type="text" id="api-key" placeholder="Вставьте API Key">
        </div>
        <div class="form-row">
            <label>API Secret</label>
            <input type="password" id="api-secret" placeholder="Вставьте API Secret">
        </div>
        <div class="form-row" id="row-passphrase" style="display:none">
            <label>Passphrase (только OKX)</label>
            <input type="text" id="api-passphrase" placeholder="Вставьте Passphrase">
        </div>
        <div class="modal-actions">
            <button class="btn-save" onclick="saveApiKeys()">Сохранить</button>
            <button class="btn-cancel" onclick="closeApiModal()">Отмена</button>
        </div>
        <div class="key-list" id="key-list"></div>
    </div>
</div>

<script>
    const userId = "{{ user.id }}";
    let chart = null, candleSeries = null;
    let currentSymbol = "", currentInterval = "1", currentTrade = null;

    // ========== CHART ==========
    function initChart() {
        if (chart) return;
        chart = LightweightCharts.createChart(document.getElementById('tv-chart'), {
            layout: { background: { color: '#161920' }, textColor: '#848e9c' },
            grid: { vertLines: { color: '#23262d' }, horzLines: { color: '#23262d' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal, vertLine: { color: '#848e9c', width: 1, style: 2 }, horzLine: { color: '#848e9c', width: 1, style: 2 } },
            rightPriceScale: { borderColor: '#23262d' },
            timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#23262d' }
        });
        candleSeries = chart.addCandlestickSeries({
            upColor: '#0ecb81', downColor: '#f6465d',
            borderDownColor: '#f6465d', borderUpColor: '#0ecb81',
            wickDownColor: '#f6465d', wickUpColor: '#0ecb81',
        });
    }

    async function loadChart(sym, tf) {
        try {
            const r = await fetch(`/api/kline?symbol=${sym}&interval=${tf}`);
            const d = await r.json();
            if (d.candles && candleSeries) {
                candleSeries.setData(d.candles);
                chart.timeScale().fitContent();
                if (currentTrade) setMarkers(currentTrade);
            }
        } catch (e) { console.error(e); }
    }

    function setMarkers(trade) {
        if (!candleSeries) return;
        const m = [];
        if (trade.entryTime) m.push({
            time: trade.entryTime, position: trade.side === 'Buy' ? 'belowBar' : 'aboveBar',
            color: trade.side === 'Buy' ? '#0ecb81' : '#f6465d',
            shape: trade.side === 'Buy' ? 'arrowUp' : 'arrowDown', text: `Вход ${trade.entryPrice}`, size: 2
        });
        if (trade.exitTime) m.push({
            time: trade.exitTime, position: trade.side === 'Buy' ? 'aboveBar' : 'belowBar',
            color: '#ffd700', shape: 'circle', text: `Выход ${trade.exitPrice}`, size: 2
        });
        candleSeries.setMarkers(m);
    }

    function openTradeChart(t) {
        currentSymbol = t.ticker; currentTrade = t;
        document.getElementById('chart-wrap').style.display = 'block';
        document.getElementById('chart-title').innerText = `${t.side === 'Buy' ? '🟢 LONG' : '🔴 SHORT'}  ${t.ticker}`;
        document.getElementById('trade-meta').innerHTML = `
            <span>Вход: <strong>${t.entryPrice}</strong></span>
            <span>Выход: <strong>${t.exitPrice}</strong></span>
            <span>Кол-во: <strong>${t.qty}</strong></span>
            <span>P&L: <strong style="color:${t.pnlPercent.includes('-')?'#f6465d':'#0ecb81'}">${t.profit}</strong></span>`;
        if (!chart) initChart();
        loadChart(currentSymbol, currentInterval);
        document.getElementById('chart-wrap').scrollIntoView({ behavior: 'smooth' });
    }

    function closeChart() {
        document.getElementById('chart-wrap').style.display = 'none';
        if (candleSeries) candleSeries.setMarkers([]);
    }

    document.querySelectorAll('.tf-btn').forEach(b => b.addEventListener('click', e => {
        document.querySelectorAll('.tf-btn').forEach(x => x.classList.remove('active'));
        e.target.classList.add('active');
        currentInterval = e.target.dataset.tf;
        if (currentSymbol) loadChart(currentSymbol, currentInterval);
    }));

    // ========== TRADES ==========
    async function loadTrades() {
        try {
            const r = await fetch(`/api/trades/${userId}`);
            const d = await r.json();
            if (d.status === "success") renderTrades(d.trades);
        } catch (e) { showEmpty("Ошибка загрузки"); }
    }

    function showEmpty(msg) {
        document.getElementById('trades-tbody').innerHTML = `<tr><td colspan="8" class="empty-state">${msg}</td></tr>`;
    }

    async function syncAll() {
        const el = document.getElementById('sync-msg');
        el.textContent = "⏳ Синхронизация...";
        try {
            const r = await fetch(`/api/sync-trades/${userId}`);
            const d = await r.json();
            if (d.status === "success") {
                renderTrades(d.trades);
                el.textContent = `✅ Обновлено (${d.trades.length})`;
                setTimeout(() => el.textContent = "", 3000);
            } else {
                el.textContent = "❌ " + d.message;
                alert(d.message);
            }
        } catch (e) { el.textContent = "❌ Ошибка"; alert("Ошибка синхронизации"); }
    }

    function renderTrades(list) {
        const tb = document.getElementById('trades-tbody');
        tb.innerHTML = "";
        if (!list || !list.length) { showEmpty("Сделок пока нет. Добавьте API-ключи и нажмите «Синхронизировать»"); return; }
        list.forEach(t => {
            const tr = document.createElement('tr');
            const cls = t.side === "Buy" ? "badge-long" : "badge-short";
            const txt = t.side === "Buy" ? "LONG" : "SHORT";
            const col = t.pnlPercent.includes('-') ? '#f6465d' : '#0ecb81';
            tr.innerHTML = `
                <td><strong>${t.ticker}</strong></td>
                <td>${t.entry}</td>
                <td>${t.exit}</td>
                <td><span class="${cls}">${txt}</span></td>
                <td style="color:${col};font-weight:bold">${t.pnlPercent}</td>
                <td style="color:${col}">${t.profit}</td>
                <td>${t.commission}</td>
                <td>${t.volume}</td>`;
            tr.onclick = () => openTradeChart(t);
            tb.appendChild(tr);
        });
    }

    // ========== API MODAL ==========
    function openApiModal() { document.getElementById('api-modal').classList.add('active'); loadKeyList(); }
    function closeApiModal() { document.getElementById('api-modal').classList.remove('active'); }
    function togglePassphrase() {
        document.getElementById('row-passphrase').style.display =
            document.getElementById('api-platform').value === 'OKX' ? 'block' : 'none';
    }

    async function saveApiKeys() {
        const fd = new FormData();
        fd.append('user_id', userId);
        fd.append('platform', document.getElementById('api-platform').value);
        fd.append('api_key', document.getElementById('api-key').value);
        fd.append('api_secret', document.getElementById('api-secret').value);
        fd.append('api_passphrase', document.getElementById('api-passphrase').value);
        const r = await fetch('/api/save-keys', { method: 'POST', body: fd });
        const d = await r.json();
        alert(d.message);
        if (d.success) { loadKeyList(); updateBrokerBadge(); }
    }

    async function loadKeyList() {
        const r = await fetch(`/api/keys/${userId}`);
        const d = await r.json();
        const box = document.getElementById('key-list');
        if (!d.keys || !d.keys.length) { box.innerHTML = '<div style="color:#848e9c;font-size:13px">Нет сохранённых ключей</div>'; return; }
        box.innerHTML = d.keys.map(k => `
            <div class="key-item">
                <span class="key-plat">${k.platform}</span>
                <span class="key-del" onclick="deleteKey('${k.platform}')">Удалить</span>
            </div>`).join('');
        updateBrokerBadge(d.keys);
    }

    async function deleteKey(platform) {
        if (!confirm(`Удалить ключи ${platform}?`)) return;
        const fd = new FormData();
        fd.append('user_id', userId); fd.append('platform', platform);
        await fetch('/api/delete-keys', { method: 'POST', body: fd });
        loadKeyList();
    }

    function updateBrokerBadge(keys) {
        const badge = document.getElementById('active-broker');
        if (keys && keys.length) {
            badge.style.display = 'flex';
            document.getElementById('broker-name').innerText = keys[0].platform;
        } else {
            badge.style.display = 'none';
        }
    }

    // ========== INIT ==========
    window.onload = () => { loadTrades(); loadKeyList(); };
</script>

</body>
</html>
