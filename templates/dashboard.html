<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Trading Journal - Дашборд</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #12141c;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .logo {
            color: #00ff88;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .btn {
            background-color: #00ff88;
            color: #12141c;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background-color: #2a2e39;
            color: #fff;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #e2e8f0;
        }
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #1a1d29;
            padding: 15px 20px;
            border-radius: 8px;
            min-width: 150px;
        }
        .stat-label {
            color: #848e9c;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .positive { color: #0ecb81; }
        .negative { color: #f6465d; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1a1d29;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid #2a2e39;
        }
        th {
            color: #848e9c;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        tr { transition: background 0.15s; }
        tr:hover {
            background-color: #222634;
            cursor: pointer;
        }
        .badge-short {
            background-color: #f6465d;
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-long {
            background-color: #0ecb81;
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        #chart-container {
            background-color: #1a1d29;
            border-radius: 8px;
            padding: 20px;
            display: none;
            position: relative;
            border: 1px solid #2a2e39;
        }
        .timeframes {
            margin-bottom: 15px;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .tf-btn {
            background: #2a2e39;
            color: #848e9c;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .tf-btn.active, .tf-btn:hover {
            background: #00ff88;
            color: #12141c;
        }
        .close-chart {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #848e9c;
            font-size: 20px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        .close-chart:hover {
            color: #fff;
            background: #f6465d;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-right: 40px;
        }
        .trade-info {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #848e9c;
        }
        .trade-info span strong {
            color: #fff;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #848e9c;
        }
        .sync-status {
            font-size: 12px;
            color: #848e9c;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">📊 Trading Journal</div>
        <div class="user-info">
            <span style="color:#848e9c">👤 {{ user.name }}</span>
            <button class="btn" onclick="syncTrades()">🔄 Синхронизировать с Bybit</button>
            <span id="sync-status" class="sync-status"></span>
        </div>
    </header>

    <!-- Статистика -->
    <div class="stats-bar" id="stats-bar" style="display:none;">
        <div class="stat-card">
            <div class="stat-label">Всего сделок</div>
            <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Общий P&L</div>
            <div class="stat-value" id="stat-pnl">0 $</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Win Rate</div>
            <div class="stat-value" id="stat-winrate">0%</div>
        </div>
    </div>

    <h2>📋 История сделок</h2>

    <table>
        <thead>
            <tr>
                <th>Тикер</th>
                <th>Вход</th>
                <th>Выход</th>
                <th>Сторона</th>
                <th>P&L %</th>
                <th>Прибыль ($)</th>
                <th>Комиссия</th>
                <th>Объём ($)</th>
            </tr>
        </thead>
        <tbody id="trades-tbody">
            <tr>
                <td colspan="8" class="empty-state">Загрузка сделок...</td>
            </tr>
        </tbody>
    </table>

    <!-- Блок графика -->
    <div id="chart-container">
        <button class="close-chart" onclick="closeChart()" title="Закрыть">✕</button>
        
        <div class="chart-header">
            <h3 id="chart-title" style="margin:0; font-size:16px; color:#00ff88;">График</h3>
            <div class="trade-info" id="trade-info"></div>
        </div>
        
        <div class="timeframes" id="tf-group">
            <button class="tf-btn active" data-tf="1">1m</button>
            <button class="tf-btn" data-tf="3">3m</button>
            <button class="tf-btn" data-tf="5">5m</button>
            <button class="tf-btn" data-tf="15">15m</button>
            <button class="tf-btn" data-tf="60">1h</button>
            <button class="tf-btn" data-tf="240">4h</button>
            <button class="tf-btn" data-tf="D">1D</button>
        </div>
        
        <div id="tradingview-chart" style="width: 100%; height: 450px;"></div>
    </div>

<script>
    const userId = "{{ user.id }}";
    let chart = null;
    let candlestickSeries = null;
    let currentSymbol = "";
    let currentInterval = "1";
    let currentTrade = null;

    // ============ ИНИЦИАЛИЗАЦИЯ ГРАФИКА ============
    function initChart() {
        if (chart) return;
        
        const container = document.getElementById('tradingview-chart');
        chart = LightweightCharts.createChart(container, {
            layout: {
                background: { color: '#1a1d29' },
                textColor: '#848e9c',
            },
            grid: {
                vertLines: { color: '#2a2e39' },
                horzLines: { color: '#2a2e39' },
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
                vertLine: { color: '#848e9c', width: 1, style: 2 },
                horzLine: { color: '#848e9c', width: 1, style: 2 },
            },
            rightPriceScale: {
                borderColor: '#2a2e39',
            },
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
                borderColor: '#2a2e39',
            }
        });
        
        candlestickSeries = chart.addCandlestickSeries({
            upColor: '#0ecb81',
            downColor: '#f6465d',
            borderDownColor: '#f6465d',
            borderUpColor: '#0ecb81',
            wickDownColor: '#f6465d',
            wickUpColor: '#0ecb81',
        });
    }

    // ============ ЗАГРУЗКА СДЕЛОК ИЗ БД ============
    async function loadTradesFromDB() {
        try {
            const res = await fetch(`/api/trades/${userId}`);
            const data = await res.json();
            if (data.status === "success") {
                renderTrades(data.trades);
                updateStats(data.trades);
            } else {
                showEmpty("Ошибка загрузки сделок");
            }
        } catch (e) {
            showEmpty("Ошибка соединения с сервером");
        }
    }

    function showEmpty(msg) {
        document.getElementById('trades-tbody').innerHTML = 
            `<tr><td colspan="8" class="empty-state">${msg}</td></tr>`;
    }

    // ============ СИНХРОНИЗАЦИЯ С БИРЖЕЙ ============
    async function syncTrades() {
        const statusEl = document.getElementById('sync-status');
        statusEl.textContent = "⏳ Синхронизация...";
        
        try {
            const res = await fetch(`/api/sync-trades/${userId}`);
            const data = await res.json();
            
            if (data.status === "success") {
                renderTrades(data.trades);
                updateStats(data.trades);
                statusEl.textContent = `✅ Синхронизировано (${data.trades.length})`;
                setTimeout(() => statusEl.textContent = "", 3000);
            } else {
                statusEl.textContent = "❌ " + data.message;
                alert(data.message);
            }
        } catch (e) {
            statusEl.textContent = "❌ Ошибка синхронизации";
            alert("Ошибка синхронизации");
        }
    }

    // ============ РЕНДЕР ТАБЛИЦЫ ============
    function renderTrades(trades) {
        const tbody = document.getElementById('trades-tbody');
        tbody.innerHTML = "";
        
        if (!trades || trades.length === 0) {
            showEmpty("Сделок пока нет. Нажмите «Синхронизировать с Bybit»");
            return;
        }
        
        trades.forEach(trade => {
            const tr = document.createElement('tr');
            const sideClass = trade.side === "Buy" ? "badge-long" : "badge-short";
            const sideText = trade.side === "Buy" ? "LONG" : "SHORT";
            const pnlColor = trade.pnlPercent.includes('-') ? '#f6465d' : '#0ecb81';
            
            tr.innerHTML = `
                <td><strong>${trade.ticker}</strong></td>
                <td>${trade.entry}</td>
                <td>${trade.exit}</td>
                <td><span class="${sideClass}">${sideText}</span></td>
                <td style="color: ${pnlColor}; font-weight:bold">${trade.pnlPercent}</td>
                <td style="color: ${pnlColor}">${trade.profit}</td>
                <td>${trade.commission}</td>
                <td>${trade.volume}</td>
            `;

            tr.onclick = () => openTradeChart(trade);
            tbody.appendChild(tr);
        });
    }

    // ============ СТАТИСТИКА ============
    function updateStats(trades) {
        if (!trades || trades.length === 0) {
            document.getElementById('stats-bar').style.display = 'none';
            return;
        }
        
        document.getElementById('stats-bar').style.display = 'flex';
        document.getElementById('stat-total').textContent = trades.length;
        
        let totalPnl = 0;
        let wins = 0;
        
        trades.forEach(t => {
            const pnlVal = parseFloat(t.profit.replace(/[^0-9.-]/g, ''));
            totalPnl += pnlVal;
            if (pnlVal > 0) wins++;
        });
        
        const pnlEl = document.getElementById('stat-pnl');
        pnlEl.textContent = (totalPnl >= 0 ? "+" : "") + totalPnl.toFixed(2) + " $";
        pnlEl.className = "stat-value " + (totalPnl >= 0 ? "positive" : "negative");
        
        const winrate = trades.length > 0 ? ((wins / trades.length) * 100).toFixed(1) : 0;
        document.getElementById('stat-winrate').textContent = winrate + "%";
        document.getElementById('stat-winrate').className = "stat-value " + (winrate >= 50 ? "positive" : "negative");
    }

    // ============ ОТКРЫТИЕ ГРАФИКА ============
    async function openTradeChart(trade) {
        currentSymbol = trade.ticker;
        currentTrade = trade;
        
        document.getElementById('chart-container').style.display = 'block';
        
        // ✅ ИСПРАВЛЕНО: правильный синтаксис для установки текста
        document.getElementById('chart-title').innerText = 
            `${trade.side === 'Buy' ? '🟢 LONG' : '🔴 SHORT'}  ${trade.ticker}`;
        
        // Инфо о сделке
        document.getElementById('trade-info').innerHTML = `
            <span>Вход: <strong>${trade.entryPrice}</strong></span>
            <span>Выход: <strong>${trade.exitPrice}</strong></span>
            <span>Кол-во: <strong>${trade.qty}</strong></span>
            <span>P&L: <strong style="color:${trade.pnlPercent.includes('-')?'#f6465d':'#0ecb81'}">${trade.profit}</strong></span>
        `;
        
        if (!chart) {
            initChart();
        }
        
        await loadRealChart(currentSymbol, currentInterval);
        
        // Добавляем маркеры входа/выхода
        setTradeMarkers(trade);
        
        // Прокручиваем к графику
        document.getElementById('chart-container').scrollIntoView({ behavior: 'smooth' });
    }

    // ============ МАРКЕРЫ ВХОДА/ВЫХОДА ============
    function setTradeMarkers(trade) {
        if (!candlestickSeries) return;
        
        const markers = [];
        
        if (trade.entryTime) {
            markers.push({
                time: trade.entryTime,
                position: trade.side === 'Buy' ? 'belowBar' : 'aboveBar',
                color: trade.side === 'Buy' ? '#0ecb81' : '#f6465d',
                shape: trade.side === 'Buy' ? 'arrowUp' : 'arrowDown',
                text: `Вход ${trade.entryPrice}`,
                size: 2
            });
        }
        
        if (trade.exitTime) {
            markers.push({
                time: trade.exitTime,
                position: trade.side === 'Buy' ? 'aboveBar' : 'belowBar',
                color: '#ffd700',
                shape: 'circle',
                text: `Выход ${trade.exitPrice}`,
                size: 2
            });
        }
        
        candlestickSeries.setMarkers(markers);
    }

    // ============ ЗАГРУЗКА СВЕЧЕЙ ============
    async function loadRealChart(symbol, interval) {
        try {
            const response = await fetch(`/api/kline?symbol=${symbol}&interval=${interval}`);
            const data = await response.json();
            
            if (data.candles && candlestickSeries) {
                candlestickSeries.setData(data.candles);
                chart.timeScale().fitContent();
                
                // Переустанавливаем маркеры после обновления данных
                if (currentTrade) {
                    setTradeMarkers(currentTrade);
                }
            }
        } catch (err) {
            console.error("Ошибка загрузки графика:", err);
        }
    }

    function closeChart() {
        document.getElementById('chart-container').style.display = 'none';
        if (candlestickSeries) {
            candlestickSeries.setMarkers([]);
        }
    }

    // ============ ТАЙМФРЕЙМЫ ============
    document.querySelectorAll('.tf-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentInterval = e.target.getAttribute('data-tf');
            if (currentSymbol) {
                loadRealChart(currentSymbol, currentInterval);
            }
        });
    });

    // ============ ЗАГРУЗКА ПРИ СТАРТЕ ============
    window.onload = () => {
        loadTradesFromDB();
    };
</script>

</body>
</html>
